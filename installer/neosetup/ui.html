<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP__ Setup</title>
<style nonce="__NONCE__">
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--accent:__ACCENT__;--accent-fg:#1d1d1f;--ok:#2f8a4a;--err:#b3261e;--soft:__SOFT_LIGHT__}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--fg:#ececef;--muted:#9a9aa2;--line:#33333a;--accent:__ACCENT__;--accent-fg:#141416;--ok:#5cc27a;--err:#ff8a80;--soft:__SOFT_DARK__}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{max-width:760px;margin:0 auto;padding:24px 16px 8px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;flex:1}
header h1 span{color:var(--accent)}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer}
.lang button.on{color:var(--fg);border-color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
ol.steps{list-style:none;padding:0;margin:0 0 16px;display:flex;gap:6px;flex-wrap:wrap}
ol.steps li{font-size:13px;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
ol.steps li.on{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}
ol.steps li.done{color:var(--ok);border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:20px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
button.primary,button.secondary{font:inherit;border-radius:8px;padding:10px 18px;cursor:pointer;margin:8px 8px 0 0}
button.primary{background:var(--accent);color:var(--accent-fg);border:0;font-weight:600}
button.secondary{background:none;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.code{font:600 32px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;margin:8px 0}
.big{font:600 28px/1.2 ui-monospace,Menlo,Consolas,monospace}
.list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row.sel{cursor:pointer}
.row.sel:hover{border-color:var(--accent)}
.row.dis{opacity:.55}
.row img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line)}
.row .av{width:36px;height:36px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:600}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.err{color:var(--err);margin:8px 0}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:12px 0}
.quit{text-align:right}
ol.howto{padding-left:22px}
ol.howto li{margin:6px 0}
.log{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:8px;padding:10px;max-height:220px;overflow:auto;margin:8px 0}
.log .ok{color:var(--ok)}
textarea,input[type=text]{width:100%;font:14px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
details{margin:12px 0}
summary{cursor:pointer;color:var(--muted)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:8px 0}
dt{color:var(--muted)}
dd{margin:0;word-break:break-word}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:520px){.code{font-size:26px}dl{grid-template-columns:1fr}}
</style>
</head>

    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.steps[0] }), h('p', { text: L.welcome }), h('p', { 'class': 'muted', text: L.privacy }));

      popup = window.open('about:blank', 'plexauth', 'width=800,height=700');
      act('login_start', { kind: 'auth' }).then(function (d) {
        if (d.ok) { authUrl = d.result.url; if (popup) popup.location.href = authUrl; else window.open(authUrl, '_blank', 'noopener'); startPoll(); }
        else if (popup) popup.close();
      });
    } }, L.login));
    c.appendChild(h('button', { 'class': 'secondary', disabled: !!busy, onclick: function () {
      act('login_start', { kind: 'link' }).then(function (d) { if (d.ok) { linkCode = d.result.code; startPoll(); render(); } });
    } }, L.loginLink));
    if (S && S.pending.indexOf('auth') >= 0) {
      c.appendChild(h('div', { 'class': 'note' }, h('span', { 'class': 'spin' }), L.loginWait));
      if (authUrl) c.appendChild(h('a', { href: authUrl, target: '_blank', rel: 'noopener noreferrer' }, L.openAgain));
    }
    if (S && S.pending.indexOf('link') >= 0 && linkCode) {
      c.appendChild(h('div', { 'class': 'note' }, h('p', { text: L.linkWait }), h('div', { 'class': 'code' }, linkCode),
        h('a', { href: 'https://plex.tv/link', target: '_blank', rel: 'noopener noreferrer' }, 'plex.tv/link')));
    }
    return c;
  }
  function startPoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      api('login_poll').then(function (d) {
        if (!d.ok && (d.error === 'network' || d.error === 'offline')) { render(); return; }   // transient: keep waiting
        if (!d.ok || (d.result && d.result.done)) { clearInterval(pollTimer); linkCode = ''; if (popup) try { popup.close(); } catch (e) {} autoStep(); }
        render();
      });
    }, 2000);
  }

  function viewServer() {
    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.chooseServer }));
    if (S.account) c.appendChild(h('p', { 'class': 'muted' }, S.account.title));
    var list = h('div', { 'class': 'list' }), any = false;
    S.servers.forEach(function (s) {
      var ok = s.owned && s.uris.length && !s.foreign;
      if (ok) any = true;
      var badges = [];
      if (s.lan) badges.push(h('span', { 'class': 'badge ok' }, L.lan));
      badges.push(h('span', { 'class': 'badge' }, s.foreign ? L.foreign : s.owned ? L.owner : L.notOwner));
      if (!s.uris.length) badges.push(h('span', { 'class': 'badge' }, L.noLan));
      list.appendChild(h('div', { 'class': 'row ' + (ok && !busy ? 'sel' : 'dis'), role: ok ? 'button' : null, tabindex: ok ? '0' : null,
        onclick: ok ? function () { if (!busy) act('choose_server', { id: s.id }, L.checking).then(function (d) { if (d.ok) { step = 2; render(); } }); } : null },
        h('div', { 'class': 'grow' }, h('div', { 'class': 't' }, s.name || s.id), h('div', { 'class': 'muted' }, s.uris[0] || '')), badges));
    });
    c.appendChild(list);
    if (!any) c.appendChild(h('p', { 'class': 'note', text: L.noServers }));
    c.appendChild(h('button', { 'class': 'secondary', disabled: !!busy, onclick: function () { act('servers'); } }, L.reload));
    c.appendChild(h('button', { 'class': 'secondary', disabled: !!busy, onclick: function () { act('logout'); } }, L.logout));
    return c;
  }

  function viewProfiles() {
    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.profilesTitle }), h('p', { 'class': 'muted', text: L.profilesHint }));
    var list = h('div', { 'class': 'list' }), boxes = [];
    S.profiles.forEach(function (p) {
      var usable = p.hasToken && p.libraries !== null;
      var cb = h('input', { type: 'checkbox', checked: p.include, disabled: !usable, 'aria-label': p.title });
      cb._id = p.id; boxes.push(cb);
      var info = [h('span', { 'class': 'badge' }, L.kind[p.kind] || p.kind)];
      if (p.restricted) info.push(h('span', { 'class': 'badge' }, L.restricted));
      var sub = !p.hasToken ? L.noToken : p.libraries === null ? L.tokenBad : L.libs(p.libraries);
      list.appendChild(h('label', { 'class': 'row ' + (usable ? 'sel' : 'dis') }, cb, avatar(p),
        h('div', { 'class': 'grow' }, h('div', { 'class': 't' }, p.title, info), h('div', { 'class': 'muted' }, sub))));
    });
    c.appendChild(list);
    var ta = h('textarea', { rows: '3', placeholder: '/Pfad/zu/MeineApp.zip' }); ta.value = (S.extraSpecs || []).join('\n');
    var tv = h('input', { type: 'text', placeholder: '192.168.x.y' }); tv.value = S.tvAddress || '';
    c.appendChild(h('details', { open: (S.extraSpecs || []).length ? true : null }, h('summary', { text: L.advanced }),
      h('p', { 'class': 't', text: L.extrasTitle }), h('p', { 'class': 'muted', text: L.extrasHint }), ta,
      h('p', { 'class': 't', text: L.tvTitle }), tv));
    c.appendChild(h('button', { 'class': 'secondary', onclick: function () { step = 1; render(); } }, L.back));
    c.appendChild(h('button', { 'class': 'primary', disabled: !!busy, onclick: function () {
      var ids = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b._id; });
      var specs = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      act('profiles', { ids: ids }).then(function (d) {
        if (!d.ok) return;
        return act('extras', { specs: specs }).then(function (d2) {
          if (!d2.ok) return;
          return act('tv', { address: tv.value.trim() }).then(function (d3) { if (d3.ok) { step = 3; render(); } });
        });
      });
    } }, L.next));
    return c;
  }

  function viewSummary() {
    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.summary }));
    var inc = S.profiles.filter(function (p) { return p.include; }).map(function (p) { return p.title; });
    var apps = ['__APP__'].concat(S.extras.map(function (a) { return a.title; }));
    c.appendChild(h('dl', null, h('dt', { text: L.server }), h('dd', { text: S.server.name }),
      h('dt', { text: L.address }), h('dd', { text: S.server.uri }),
      h('dt', { text: L.profiles }), h('dd', { text: inc.join(', ') }),
      h('dt', { text: L.apps }), h('dd', { text: apps.join(', ') }),
      S.tvAddress ? h('dt', { text: 'TV' }) : null, S.tvAddress ? h('dd', { text: S.tvAddress }) : null));
    c.appendChild(h('p', { 'class': 'note', text: L.extrasHint }));
    // Erneute Einrichtung behaelt die App-PINs; Rettungsweg bei vergessener Hauptprofil-PIN (Nutzerentscheidung 26.10.)
    var rp = h('input', { type: 'checkbox', checked: !!resetPins });
    rp.addEventListener('change', function () { resetPins = rp.checked; });
    c.appendChild(h('label', { 'class': 'row sel' }, rp, h('div', { 'class': 'grow' }, h('div', { 'class': 't' }, L.resetPins), h('div', { 'class': 'muted' }, L.resetPinsHint))));
    // optionaler Helfer (installer/README.md "Optionaler Helfer"): Haken + Merken + andere Adresse (NAS)
    var hp = S.helper, hon = h('input', { type: 'checkbox', checked: hp.wanted }), hrem = h('input', { type: 'checkbox', checked: hp.remember });
    var hadr = h('input', { type: 'text', placeholder: '192.168.x.y' }); hadr.value = hp.address || '';
    c.appendChild(h('label', { 'class': 'row sel' }, hon, h('div', { 'class': 'grow' }, h('div', { 'class': 't' }, L.helperOn), h('div', { 'class': 'muted' }, L.helperText))));
    c.appendChild(h('details', null, h('summary', { text: L.advanced }), h('label', null, hrem, ' ', L.helperRemember), h('p', { 'class': 't', text: L.helperAddr }), hadr));
    c.appendChild(h('button', { 'class': 'secondary', onclick: function () { step = 2; render(); } }, L.back));
    c.appendChild(h('button', { 'class': 'primary', disabled: !!busy, onclick: function () {
      act('helper', { on: hon.checked, remember: hrem.checked, address: hadr.value.trim() }).then(function (d0) { if (!d0.ok) return;
      act('build', { resetPins: !!resetPins }, L.building).then(function (d) {
        if (!d.ok) return;
        step = 4; act('sync_start');
      }); });
    } }, L.build));
    return c;
  }

  function syncLog(ev) {
    var L = t(), box = h('div', { 'class': 'log', 'aria-live': 'polite' });
    if (!ev.length) box.appendChild(h('div', { 'class': 'muted' }, h('span', { 'class': 'spin' }), L.waiting));
    ev.forEach(function (e) {
      var d = new Date(e.t * 1000), ts = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
      box.appendChild(h('div', { 'class': e.status === 200 ? 'ok' : '' }, ts + '  ' + (e.status === 200 ? L.fetched(e.client, e.path.replace(/^\//, '')) : e.status === 403 ? L.denied(e.client) : e.client + ' ' + e.path + ' ' + e.status)));
    });
    return box;
  }

  function viewTv() {
    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.tvTitleStep }), h('p', { text: L.tvIntro }));
    var how = h('ol', { 'class': 'howto' });
    L.how.forEach(function (x, i) { how.appendChild(h('li', null, x, i === 3 ? h('div', { 'class': 'big' }, S.computer || '?') : null)); });
    c.appendChild(how);
    var sy = S.sync, got = sy.events.some(function (e) { return e.status === 200 && e.path === '/__PKG__'; });
    c.appendChild(h('p', { 'class': sy.running ? '' : 'err', text: sy.running ? L.syncRunning : L.syncOff }));
    c.appendChild(syncLog(sy.events));
    if (got) c.appendChild(h('p', { 'class': 'note', text: L.gotAll }));
    if (sy.lockedTo) c.appendChild(h('p', { 'class': 'muted' }, L.locked(sy.lockedTo), ' ', h('button', { 'class': 'secondary', onclick: function () { act('sync_unlock'); } }, L.unlock)));
    c.appendChild(h('button', { 'class': 'secondary', onclick: function () { step = 3; render(); } }, L.back));
    c.appendChild(h('button', { 'class': 'secondary', onclick: function () { act(sy.running ? 'sync_stop' : 'sync_start'); } }, sy.running ? L.stopSync : L.startSync));
    c.appendChild(h('button', { 'class': got ? 'primary' : 'secondary', onclick: function () { step = 5; render(); } }, L.onTv));
    return c;
  }

  function viewDone() {
    var L = t(), c = h('div', { 'class': 'card' }, h('h2', { text: L.doneTitle }), h('p', { text: L.doneText }));
    var rem = h('input', { type: 'checkbox', checked: S.remember });
    rem.addEventListener('change', function () { api('prefs', { remember: rem.checked }); });
    c.appendChild(h('label', null, rem, ' ', L.remember));
    if (!finished) c.appendChild(h('div', null, h('button', { 'class': 'primary', onclick: function () { finished = true; act('finish'); } }, L.finish)));
    else c.appendChild(h('p', { 'class': 'note', text: L.finished }));
    var u = S.update, uc = h('div', { 'class': 'card' }, h('h2', { text: L.updTitle }), h('p', { 'class': 'muted', text: L.updText }));
    uc.appendChild(h('button', { 'class': u.running ? 'secondary' : 'primary', onclick: function () { act(u.running ? 'update_stop' : 'update_start'); } }, u.running ? L.updStop : L.updStart));
    if (u.running) { uc.appendChild(h('span', { 'class': 'badge ok' }, L.updOn(u.port))); uc.appendChild(syncLog(u.events)); }
    return h('div', null, c, uc);
  }

  function helperCard() {
    var L = t(), hp = S.helper;
    if (!hp || !hp.configured) return null;
    var c = h('div', { 'class': 'card' }, h('h2', { text: L.helperTitle }), h('p', { 'class': 'muted', text: L.helperText }));
    c.appendChild(h('p', { 'class': hp.running ? '' : 'muted', text: hp.running ? L.helperRunning(hp.port) : L.helperOff }));
    if (hp.profiles.length) c.appendChild(h('p', null, L.helperProfiles + ': ' + hp.profiles.map(function (p) { return p.title; }).join(', ')));
    if (hp.skipped.length) c.appendChild(h('p', { 'class': 'muted' }, L.helperSkipped + ' ' + hp.skipped.join(', ')));
    c.appendChild(h('button', { 'class': hp.running ? 'secondary' : 'primary', disabled: !!busy, onclick: function () { act(hp.running ? 'helper_stop' : 'helper_start'); } }, hp.running ? L.helperStop : L.helperStart));
    c.appendChild(h('button', { 'class': 'secondary', disabled: !!busy, onclick: function () { act('helper', { on: false, remember: false, address: '' }); } }, L.helperForget));
    c.appendChild(h('p', { 'class': 'muted', text: L.helperAuto }));
    if (hp.running) c.appendChild(syncLog(hp.events));
    return c;
  }
  function quitCard() {
    var L = t();
    return h('div', { 'class': 'quit' }, h('button', { 'class': 'secondary', disabled: !!busy, onclick: function () {
      if (!window.confirm(L.quitConfirm)) return;
      clearInterval(pollTimer);
      api('quit').then(function () { quitted = true; render(); });
    } }, L.quit));
  }
  function render() {
    if (!S) return;
    stepper();
    var v = document.getElementById('view'); v.textContent = '';
    if (quitted) { v.appendChild(h('div', { 'class': 'card' }, h('h2', { text: t().quitDone }))); return; }
    var views = [viewLogin, viewServer, viewProfiles, viewSummary, viewTv, viewDone];
    v.appendChild(views[step]());
    var hc = helperCard();
    if (hc) v.appendChild(hc);
    v.appendChild(quitCard());
    var e = errBox(), b = busyBox();
    if (b) v.insertBefore(b, v.firstChild);
    if (e) v.insertBefore(e, v.firstChild);
  }

  // live updates of sync/update logs
  setInterval(function () { if (!quitted && (step === 4 || step === 5 || (step <= 1 && S && S.helper && S.helper.running)) && !busy) api('state').then(render); }, 2000);
  api('state').then(function () { if (S && S.lang) lang = S.lang; autoStep(); render(); });
})();
</script>
