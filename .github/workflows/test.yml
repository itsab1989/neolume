# Neolume – Unit-Tests + Build-Gates (ES5, CSS, i18n) bei jedem Push/PR. Ohne Geheimnisse, ohne Netz.
# Die visuelle Regression (npm run visual) braucht Firefox und laeuft lokal.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
