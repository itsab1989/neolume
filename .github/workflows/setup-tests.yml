# Setup program (installer/): unit/integration tests on all desktop OSes and the oldest supported Python,
# plus the .pyz smoke test and the headless-Firefox UI test. Offline: plex.tv, PMS and GDM are mocked.
name: setup-tests

on:
  push:
    paths:
      - 'installer/**'
      - 'tests/installer/**'
      - '.github/workflows/setup-tests.yml'
      - '.github/workflows/release-setup.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'tests/installer/**'
      - '.github/workflows/setup-tests.yml'
      - '.github/workflows/release-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: tests ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/installer -v

  pyz-and-ui:
    name: .pyz smoke + browser UI test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build payload + .pyz
        run: |
          python installer/build.py payload
          python installer/build.py pyz --out dist-setup
      - name: Smoke test .pyz
        run: python installer/smoke_test.py python3 "dist-setup/$(python installer/build.py name).pyz"
      - name: Browser UI test (headless Firefox, WebDriver BiDi)
        run: |
          FIREFOX="$(command -v firefox)" node tests/installer/e2e/ui_e2e.js
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: installer/Dockerfile
