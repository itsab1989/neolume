<!DOCTYPE html>
<!-- Desktop-Vorschau (nur Entwicklung, nicht Teil des TV-Pakets).
     Laedt ../app/app.js mit einem nachgebauten Lader-Kontext (Speicher = localStorage) und uebersetzt Tastatur -> TV-Codes:
     Pfeile, Enter = OK, Backspace/Esc = RETURN, r/g/y/b = Farbtasten, i = INFO, t = TOOLS, p = PLAY, Leertaste = PAUSE, s = STOP, f/w = FF/RW, u = SUBTITLE, 0-9 = Ziffern.
     Parameter: ?keys=DOWN,RIGHT,ENTER (automatische Tastenfolge, 400 ms Abstand, Start nach &wait=ms)
                &seed=<URL einer JS-Datei, die window.PN_SEED = {'state.json': '…'} (und optional window.PN_SETUP = setup.json-Text) setzt> (lokal, nie einchecken)
                &src=dev (ctx.source, schaltet Dev-Funktionen ein)  &min=1 (app.min.js = Release-Build statt app.js)  &clear=1 (Speicher leeren)  &hold=ms (Screenshot-Hilfe)
                &moves=x:y,click@x:y (Zeiger)  &gap=ms (Tastenabstand)
                &bench=all|home,lib,leak:20 (P7-Messlauf, braucht &src=dev)  &logurl=<URL> (Protokollzeilen per POST, tools/bench.js) -->
<html>
<head>
<meta charset="utf-8">
<title>App-Vorschau</title>
<style>html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#101114}#root{position:absolute;left:0;top:0;width:1280px;height:720px}</style>
<script>
  (function () {
    var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || ''); });
    window.PN_Q = q;
    if (q.seed) document.write('<script src="' + q.seed.replace(/"/g, '') + '"><\/script>');
    // &hold=ms: haelt das load-Ereignis auf (fuer Kopflos-Screenshots); braucht einen lokalen Sleep-Server auf :8765
    if (q.hold) document.write('<img style="display:none" src="' + (q.holdurl || 'http://127.0.0.1:8765/sleep').replace(/"/g, '') + '?ms=' + Number(q.hold) + '">');
  })();
</script>
</head>
<body>
<div id="root"></div>
<script>window.PN_T0 = new Date().getTime(); document.write('<script src="../app/app' + (window.PN_Q.min ? '.min' : '') + '.js"><\/script>');</script>
<script>
  (function () {
    var q = window.PN_Q, P = 'plexneo.';
    if (q.clear) { for (var k in localStorage) if (k.indexOf(P) === 0) localStorage.removeItem(k); }
    if (window.PN_SEED) for (var f in window.PN_SEED) localStorage.setItem(P + f, window.PN_SEED[f]);
    var store = {
      read: function (n) { return localStorage.getItem(P + n); },
      write: function (n, t) { localStorage.setItem(P + n, t); return true; },
      probe: function (n) { return { file: null, local: localStorage.getItem(P + n) }; }
    };
    var logBox = null;
    if (q.log) { logBox = document.createElement('div'); logBox.style.cssText = 'position:absolute;left:0;top:0;width:1280px;z-index:99;font:12px monospace;color:#0f0;background:rgba(0,0,0,.7);white-space:pre'; document.body.appendChild(logBox); }
    var sendBuf = [], sendT = 0;
    function send() { sendT = 0; var x = new XMLHttpRequest(); x.open('POST', q.logurl, true); x.send(sendBuf.splice(0, sendBuf.length).join('\n')); }
    var log = function (m) {
      if (window.console) console.log(m); if (logBox) logBox.textContent = (logBox.textContent + '\n' + m).split('\n').slice(-25).join('\n');
      if (q.logurl) { sendBuf.push(m); if (!sendT) sendT = setTimeout(send, 200); }
    };
    log('preview eval ' + (new Date().getTime() - window.PN_T0) + 'ms (' + (q.min ? 'app.min.js' : 'app.js') + ')');
    if (q.bench) window.PN_BENCH = q.bench;
    // setup.json (PMS-only, P2): der Seed kann window.PN_SETUP = '<JSON-Text>' setzen; ohne -> wie Entwicklungs-Paket ohne setup.json
    App.start({ source: (q.src || 'vorschau') + ' 0ms', log: log, store: store, widgetAPI: { sendReturnEvent: function () { log('EXIT'); } },
      setupText: window.PN_SETUP !== undefined ? window.PN_SETUP : null });
    var CODES = { UP: 29460, DOWN: 29461, LEFT: 4, RIGHT: 5, ENTER: 29443, RETURN: 88, RED: 108, GREEN: 20, YELLOW: 21, BLUE: 22, INFO: 31, TOOLS: 75, PLAY: 71, PAUSE: 74, STOP: 70, FF: 72, RW: 69, SUBTITLE: 652,
      '0': 17, '1': 101, '2': 98, '3': 6, '4': 8, '5': 9, '6': 10, '7': 12, '8': 13, '9': 14 };
    var KB = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Enter: 'ENTER', Backspace: 'RETURN', Escape: 'RETURN',
      r: 'RED', g: 'GREEN', y: 'YELLOW', b: 'BLUE', i: 'INFO', t: 'TOOLS', p: 'PLAY', ' ': 'PAUSE', s: 'STOP', f: 'FF', w: 'RW', u: 'SUBTITLE' };
    document.addEventListener('keydown', function (e) {
      var k = KB[e.key] || (/^[0-9]$/.test(e.key) ? e.key : null);
      if (!k) return;
      e.preventDefault();
      App.onKey(CODES[k], e);
    });
    // &moves=x:y,x:y,click@x:y – Zeiger-Ereignisse am #root (Smart-Control-Simulation), 300 ms Abstand
    if (q.moves) {
      var mv = q.moves.split(','), mi = 0, root = document.getElementById('root');
      setTimeout(function mstep() {
        if (mi >= mv.length) return;
        var m = mv[mi++], click = m.indexOf('click@') === 0, xy = m.replace('click@', '').split(':');
        var ev = document.createEvent('MouseEvents');
        ev.initMouseEvent(click ? 'click' : 'mousemove', true, true, window, 0, 0, 0, Number(xy[0]), Number(xy[1]), false, false, false, false, 0, null);
        root.dispatchEvent(ev);
        setTimeout(mstep, 300);
      }, Number(q.mwait || 2500));
    }
    if (q.keys) {
      var list = q.keys.split(','), i = 0;
      setTimeout(function step() {
        if (i >= list.length) return;
        var k = list[i++];
        if (/^wait\d+$/.test(k)) { setTimeout(step, Number(k.slice(4))); return; }
        App.onKey(CODES[k]); setTimeout(step, Number(q.gap || 400));
      }, Number(q.wait || 1500));
    }
  })();
</script>
</body>
</html>
