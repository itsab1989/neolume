    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F45"/><stop offset="1" stop-color="#23262A"/>
    </linearGradient>
    <linearGradient id="icbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E33"/><stop offset="1" stop-color="#121316"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <!-- poster row (abstract) -->
  <g opacity="0.9">
