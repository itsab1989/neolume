    <rect x="1080" y="110" width="120" height="180" rx="12" fill="#24272B"/>
    <rect x="1220" y="110" width="120" height="180" rx="12" fill="#1C1E21"/>
    <rect x="900" y="90" width="150" height="220" rx="14" fill="url(#card)"/>
    <rect x="888" y="78" width="174" height="244" rx="22" fill="none" stroke="#2EC4B6" stroke-width="6"/>
    <path d="M958 172 L958 228 L1006 200 Z" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="8" stroke-linejoin="round"/>
