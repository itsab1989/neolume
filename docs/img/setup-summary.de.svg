<title id="t">Einrichtungsprogramm: Übersicht</title>
<desc id="d">Skizze der Seite „Übersicht“ im Einrichtungsprogramm: Server, Adresse, Profile, Apps; Kästchen „App-PINs zurücksetzen“; Bereich „Weitere Server“ mit Knopf „Freigegebene Server suchen“; Kästchen „Helfer einrichten“ (angekreuzt, hervorgehoben); unter „Erweitert“ „Zugang auf diesem Computer merken“ (angekreuzt) und ein Feld für ein anderes Gerät; Knöpfe „Zurück“ und „App-Paket erstellen“.</desc>
