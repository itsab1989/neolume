<text x="24" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Die Meldung ist auch auf deutschen Fernsehern englisch. Bleibt danach das Menü offen: RETURN.</text>
