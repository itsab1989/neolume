<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" role="img" aria-labelledby="t d">
<title id="t">Helfer-Symbol in der Mac-Menüleiste</title>
<desc id="d">Skizze der Mac-Menüleiste mit dem Fernseher-Symbol des Helfers und seinem geöffneten Menü: „Helfer läuft (Port 32499, nur Heimnetz)“, „plex.tv: erreichbar“, „Fernseher zuletzt gesehen: heute 20:15“, dann Pausieren, Einrichtungsprogramm öffnen …, Was macht der Helfer?, Helfer beenden, Helfer entfernen ….</desc>
