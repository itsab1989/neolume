<text x="52" y="453" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Das Fernseher-Symbol des Helfers oben rechts in der Menüleiste anklicken</text>
<circle cx="32" cy="477" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="481.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="52" y="483" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Die drei grauen Zeilen zeigen den Zustand: läuft? plex.tv erreichbar? Fernseher zuletzt?</text>
<circle cx="32" cy="507" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="511.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="52" y="513" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Pausieren, Einrichtungsprogramm öffnen, Erklärung, Beenden, Entfernen</text>
<text x="24" y="543" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Uhrzeit ist ein Beispiel. „Fernseher: noch nicht gesehen“ ist normal, bis die App Merkliste oder Trends öffnet.</text>
</svg>
