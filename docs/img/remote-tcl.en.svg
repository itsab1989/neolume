<svg xmlns="http://www.w3.org/2000/svg" width="800" height="312" viewBox="0 0 800 312" role="img" aria-labelledby="t d">
<title id="t">Remote (Android TV): the important buttons</title>
<desc id="d">Sketch of a TCL remote for Google TV. Highlighted: the arrow buttons with OK in the middle, Back and Home. Also the number buttons 0–9, the colour buttons R G Y B, Info (ⓘ), the menu button (≡), CH ▲▼ and volume. There is no play/pause button.</desc>
