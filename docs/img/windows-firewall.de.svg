<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" role="img" aria-labelledby="t d">
<title id="t">Windows: Firewall-Frage</title>
<desc id="d">Skizze der Windows-Sicherheit-Frage „Möchten Sie öffentlichen und privaten Netzwerken den Zugriff auf diese App gestatten?“ mit Name „Neolume Setup &amp; Helper“, Herausgeber „Neolume“, Pfad zu neolume-helper.exe und den Knöpfen „Zulassen“ (hervorgehoben) und „Abbrechen“.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2747"/><stop offset="1" stop-color="#0c1127"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c8fe8"/><stop offset="1" stop-color="#1f62c8"/></linearGradient><linearGradient id="neo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16181b"/><stop offset="1" stop-color="#0e0f11"/></linearGradient></defs>
<rect x="8" y="8" width="784" height="380" rx="12" fill="#2f5d8a" stroke="#d5d9e0" stroke-width="3"/>
<rect x="110" y="30" width="580" height="336" rx="8" fill="#ffffff" stroke="#9da3ab" stroke-width="1"/>
<rect x="110" y="30" width="580" height="34" rx="8" fill="#f3f3f3"/>
<text x="126" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d1d1f" text-anchor="start">Windows-Sicherheit</text>
<text x="672" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d1d1f" text-anchor="end">✕</text>
<path d="M134 92 l18 -6 l18 6 v14 c0 12 -9 18 -18 22 c-9 -4 -18 -10 -18 -22 z" fill="#0067c0"/>
<text x="182" y="104" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1d1d1f" text-anchor="start">Möchten Sie öffentlichen und privaten Netzwerken den</text>
<text x="182" y="130" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1d1d1f" text-anchor="start">Zugriff auf diese App gestatten?</text>
<text x="182" y="180" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5c5f66" text-anchor="start">Name</text>
<text x="300" y="180" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d1d1f" text-anchor="start">Neolume Setup &amp; Helper</text>
<text x="182" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5c5f66" text-anchor="start">Herausgeber</text>
<text x="300" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1d1d1f" text-anchor="start">Neolume</text>
<text x="182" y="236" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5c5f66" text-anchor="start">Pfad</text>
<text x="300" y="236" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1d1d1f" text-anchor="start">C:\Users\…\NeolumeSetup\bin\neolume-helper.exe</text>
<rect x="294" y="160" width="230" height="28" rx="6" fill="none" stroke="#ff7a1a" stroke-width="2"/>
<circle cx="524" cy="174" r="12" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="524" y="178.56" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<rect x="110" y="296" width="580" height="70" rx="8" fill="#f3f3f3"/>
<rect x="390" y="314" width="132" height="34" rx="5" fill="#0067c0"/>
<text x="456" y="336" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Zulassen</text>
<rect x="534" y="314" width="132" height="34" rx="5" fill="#ffffff" stroke="#c7cad0" stroke-width="1"/>
<text x="600" y="336" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1d1d1f" text-anchor="middle">Abbrechen</text>
<circle cx="390" cy="314" r="13" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="390" y="318.94" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<rect x="8" y="394" width="784" height="166" rx="10" fill="#f3f4f6" stroke="#d0d4da" stroke-width="1.5"/>
<circle cx="32" cy="417" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="421.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="52" y="423" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Hier steht der Name des Programms: „Neolume Setup &amp; Helper“ (.pyz-Datei: „Python“)</text>
<circle cx="32" cy="447" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="451.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="52" y="453" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">„Zulassen“ klicken – sonst erreicht der Fernseher den Computer nicht</text>
<text x="24" y="483" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Kommt beim ersten Start des Einrichtungsprogramms und einmal nach „Helfer dauerhaft installieren“</text>
<text x="24" y="513" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">(unter „Pfad“ steht jeweils die Datei, die gerade startet). Ältere Windows-Versionen: „Private Netzwerke“</text>
<text x="24" y="543" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">ankreuzen → „Zugriff zulassen“.</text>
</svg>
