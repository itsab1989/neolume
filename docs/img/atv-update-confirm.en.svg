<svg xmlns="http://www.w3.org/2000/svg" width="800" height="556" viewBox="0 0 800 556" role="img" aria-labelledby="t d">
<title id="t">Android: install the update</title>
<desc id="d">Sketch of Android’s question with the icon and name Neolume and the text “Do you want to install an update to this existing app? Your existing data will not be lost.”. The highlight is on Cancel (1), an arrow points right to Install (2).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2747"/><stop offset="1" stop-color="#0c1127"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c8fe8"/><stop offset="1" stop-color="#1f62c8"/></linearGradient><linearGradient id="neo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16181b"/><stop offset="1" stop-color="#0e0f11"/></linearGradient></defs>
<rect x="8" y="8" width="784" height="455" rx="18" fill="#20232a" stroke="#d5d9e0" stroke-width="4"/>
<rect x="24" y="24" width="752" height="423" rx="4" fill="url(#scr)"/>
<rect x="24" y="24" width="752" height="423" rx="4" fill="#000000" fill-opacity="0.4"/>
<rect x="130" y="90" width="540" height="206" rx="12" fill="#2d2f33" stroke="#5f6368" stroke-width="1"/>
<g transform="translate(158 112) scale(0.0360656)"><rect x="0" y="0" width="1220" height="1000" rx="150" fill="#16181b"/><rect x="236" y="280" width="290" height="436" rx="34" fill="#2A2E33"/><rect x="566" y="196" width="388" height="584" rx="44" fill="#33383e"/><rect x="534" y="164" width="452" height="648" rx="72" fill="none" stroke="#2EC4B6" stroke-width="32"/><path d="M704 404 L704 572 L846 488 Z" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="26" stroke-linejoin="round"/></g>
<text x="214" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e8eaed" text-anchor="start">Neolume</text>
<text x="158" y="188" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#c4c7cc" text-anchor="start">Do you want to install an update to this existing app? Your existing</text>
<text x="158" y="209" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#c4c7cc" text-anchor="start">data will not be lost.</text>
<rect x="483.964" y="246" width="79.926" height="36" rx="8" fill="#e8eaed"/>
<text x="523.927" y="270" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#202124" text-anchor="middle">Cancel</text>
<text x="611.945" y="270" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8ab4f8" text-anchor="middle">Install</text>
<rect x="570.89" y="243" width="82.11" height="42" rx="10" fill="none" stroke="#ff7a1a" stroke-width="3"/>
<line x1="523.927" y1="284" x2="523.927" y2="300" stroke="#ff7a1a" stroke-width="3"/>
<line x1="523.927" y1="300" x2="611.945" y2="300" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="611.945" y1="300" x2="611.945" y2="286" stroke="#ff7a1a" stroke-width="3"/>
<circle cx="483.964" cy="246" r="12" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="483.964" y="250.56" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="650" cy="246" r="13" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="250.94" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<rect x="8" y="474" width="784" height="76" rx="10" fill="#f3f4f6" stroke="#d0d4da" stroke-width="1.5"/>
<circle cx="32" cy="497" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="501.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="52" y="503" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Careful: the highlight starts on Cancel – press ► once</text>
<circle cx="32" cy="527" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="531.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="52" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Now Install is highlighted: press OK. Then start Neolume again.</text>
</svg>
