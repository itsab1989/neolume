<title id="t">Helper card: installed permanently</title>
<desc id="d">Sketch of the helper card after installing on a Mac: “Installed permanently”, name in macOS, green “Running in the background (port 32499, home network only)”, checkbox for the icon, buttons “Stop” and “Turn autostart off”, log path, button “Remove helper …” and the result list.</desc>
