<title id="t">Setup program: To the TV</title>
<desc id="d">Sketch of the “To the TV” page: six steps, at step 4 the computer’s address in large digits (example 192.168.1.20). Below, the log: “TV … fetched widgetlist.xml” and “TV … fetched Neolume.zip”. Buttons “Back”, “Stop sync server” and “The app is on the TV”.</desc>
