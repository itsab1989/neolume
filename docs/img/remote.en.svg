<title id="t">Remote: the important buttons</title>
<desc id="d">Sketch of a Samsung remote (2014). Highlighted: MENU, SMART HUB (the colourful button), the arrow buttons with OK in the middle and RETURN. Also number buttons, TOOLS, INFO, EXIT, the colour buttons A B C D and the playback buttons.</desc>
