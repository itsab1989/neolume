<rect x="70" y="250" width="124" height="120" rx="8" fill="#2a2e33"/>
<rect x="210" y="250" width="124" height="120" rx="8" fill="#2a2e33"/>
<rect x="350" y="250" width="124" height="120" rx="8" fill="#2a2e33"/>
<rect x="490" y="250" width="124" height="120" rx="8" fill="#2a2e33"/>
<rect x="630" y="250" width="124" height="120" rx="8" fill="#2a2e33"/>
<rect x="24" y="24" width="752" height="423" rx="4" fill="#000000" fill-opacity="0.5"/>
<rect x="130" y="110" width="540" height="180" rx="12" fill="#2d2f33" stroke="#5f6368" stroke-width="1"/>
<text x="158" y="150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e8eaed" text-anchor="start">Neue Version 1.0.19</text>
<text x="158" y="182" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#c4c7cc" text-anchor="start">Für Neolume gibt es ein Update. Jetzt installieren? Das dauert etwa</text>
<text x="158" y="203" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#c4c7cc" text-anchor="start">eine Minute; danach startest du die App einfach neu.</text>
<text x="488.788" y="264" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8ab4f8" text-anchor="middle">Später</text>
<text x="593.978" y="264" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8ab4f8" text-anchor="middle">Installieren</text>
<rect x="534.956" y="237" width="118.044" height="42" rx="10" fill="none" stroke="#ff7a1a" stroke-width="3"/>
<circle cx="650" cy="240" r="13" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="244.94" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<rect x="8" y="474" width="784" height="76" rx="10" fill="#f3f4f6" stroke="#d0d4da" stroke-width="1.5"/>
<circle cx="32" cy="497" r="11" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="32" y="501.18" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.65" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="52" y="503" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Installieren wählen und OK. „Später“ fragt erst in 24 Stunden wieder.</text>
<text x="24" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Die Versionsnummer ist ein Beispiel.</text>
</svg>
