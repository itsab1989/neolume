<title id="t">Einrichtungsprogramm: Auf den Fernseher</title>
<desc id="d">Skizze der Seite „Auf den Fernseher“: Anleitung in sechs Schritten, bei Schritt 4 die Adresse des Computers groß (Beispiel 192.168.1.20). Darunter das Protokoll: „Fernseher … hat widgetlist.xml abgeholt“ und „… hat Neolume.zip abgeholt“. Knöpfe „Zurück“, „Sync-Server stoppen“ und „Die App ist auf dem Fernseher“.</desc>
