<text x="52" y="375" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">The helper is listed as “Neolume Setup &amp; Helper”, publisher “Neolume” (.pyz: “Python”)</text>
<text x="24" y="405" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Right-click → “Disable” only switches the autostart off. To remove it completely: section 13.7.</text>
<text x="24" y="435" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">In the Startup folder (Win + R → shell:startup) the shortcut is called “Neolume Helper”.</text>
