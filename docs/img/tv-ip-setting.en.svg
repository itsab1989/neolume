<text x="24" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">    ► moves to the next box, ◄ goes back. Example: 192.168.1.20</text>
