<text x="24" y="593" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Note: the boxes are always empty when the dialog opens. Never confirm it empty – RETURN cancels.</text>
