<title id="t">Helper card: install permanently</title>
<desc id="d">Sketch of the card “Optional helper: watchlist &amp; trends” in the setup program: text, “Watchlist for”, button “Start helper”; in the box “Permanently in the background” the checkbox “Show icon in the menu bar” (ticked) and the button “Install helper permanently”; at the bottom “Remove helper …”.</desc>
