<title id="t">Android: „Möchtest du diese App installieren?“</title>
<desc id="d">Skizze der Rückfrage von Android: oben Symbol und Name Neolume, darunter „Möchtest du diese App installieren?“, unten rechts die Knöpfe Abbrechen und Installieren (orange umrandet).</desc>
