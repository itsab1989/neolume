<circle cx="630" cy="256" r="13" fill="#ff7a1a" stroke="#ffffff" stroke-width="2"/>
<text x="630" y="260.94" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
