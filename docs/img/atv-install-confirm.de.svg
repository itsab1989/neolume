<text x="52" y="503" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Installieren wählen und OK drücken (steht die Markierung auf Abbrechen: erst ►)</text>
<text x="24" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Nach ein paar Sekunden: „App installiert“ – mit Öffnen startest du Neolume gleich.</text>
