<svg xmlns="http://www.w3.org/2000/svg" width="800" height="516" viewBox="0 0 800 516" role="img" aria-labelledby="t d">
<title id="t">So funktioniert die Installation</title>
<desc id="d">Schema: Computer mit Einrichtungsprogramm, plex.tv, Plex Media Server und Fernseher. 1: Computer meldet sich bei plex.tv an. 2: Fernseher holt das App-Paket vom Computer. 3: Im Alltag spricht der Fernseher nur mit dem Server. Gestrichelt: optionaler Helfer für Merkliste und Trends.</desc>
