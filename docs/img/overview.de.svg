<text x="590" y="230" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f7a72" text-anchor="start">3  Alltag: nur</text>
<text x="590" y="248" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f7a72" text-anchor="start">Fernseher ↔ Server</text>
<line x1="400" y1="140" x2="400" y2="226" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 5"/>
<text x="410" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4b5563" text-anchor="start">optional: Helfer</text>
<rect x="8" y="374" width="784" height="136" rx="10" fill="#f3f4f6" stroke="#d0d4da" stroke-width="1.5"/>
