<text x="24" y="593" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Beide Einträge gibt es nur mit dem Benutzer develop. Sie bleiben auch im deutschen Menü englisch.</text>
