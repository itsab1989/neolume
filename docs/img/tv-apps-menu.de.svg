<svg xmlns="http://www.w3.org/2000/svg" width="800" height="616" viewBox="0 0 800 616" role="img" aria-labelledby="t d">
<title id="t">SAMSUNG APPS: Menü mit IP Setting und Start User App Sync</title>
<desc id="d">Skizze: Bildschirm SAMSUNG APPS mit den Abschnitten EMPFOHLEN und EIGENE APPS. Auf einer App-Kachel wurde OK lange gehalten; ein Menü zeigt Verschieben, Entfernen, Mehr löschen, Details anzeigen, Ansicht ändern, Sperren/Sperre aus, Apps aktualisieren, IP Setting (markiert) und Start User App Sync.</desc>
