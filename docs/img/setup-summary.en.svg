<title id="t">Setup program: Summary</title>
<desc id="d">Sketch of the “Summary” page of the setup program: server, address, profiles, apps; checkbox “Reset app PINs”; “Other servers” with the button “Search shared servers”; checkbox “Set up the helper” (ticked, highlighted); under “Advanced” “Remember access on this computer” (ticked) and a field for another device; buttons “Back” and “Create app package”.</desc>
