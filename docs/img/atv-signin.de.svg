<text x="52" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1f2328" text-anchor="start">Oder mit der Handykamera den QR-Code scannen – er öffnet dieselbe Seite</text>
<text x="24" y="563" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Code und QR-Code sind Beispiele; dein Fernseher zeigt eigene.</text>
