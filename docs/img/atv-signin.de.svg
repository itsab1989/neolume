<svg xmlns="http://www.w3.org/2000/svg" width="800" height="586" viewBox="0 0 800 586" role="img" aria-labelledby="t d">
<title id="t">Neolume: mit Code anmelden</title>
<desc id="d">Skizze der Anmeldung von Neolume: Überschrift „Mit deinem Plex-Konto verbinden“, drei Schritte, der Beispielcode K7QX in einem Kasten (1), rechts ein QR-Code mit „Oder QR-Code scannen – öffnet plex.tv/link“ (2).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2747"/><stop offset="1" stop-color="#0c1127"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c8fe8"/><stop offset="1" stop-color="#1f62c8"/></linearGradient><linearGradient id="neo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16181b"/><stop offset="1" stop-color="#0e0f11"/></linearGradient></defs>
<rect x="8" y="8" width="784" height="455" rx="18" fill="#20232a" stroke="#d5d9e0" stroke-width="4"/>
<rect x="24" y="24" width="752" height="423" rx="4" fill="url(#neo)"/>
<text x="64" y="84" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#f2f2f2" text-anchor="start">Mit deinem Plex-Konto verbinden</text>
<text x="64" y="128" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#c4c7cc" text-anchor="start">1  Öffne plex.tv/link auf Handy oder Computer.</text>
<text x="64" y="158" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#c4c7cc" text-anchor="start">2  Melde dich dort mit deinem Plex-Konto an.</text>
<text x="64" y="188" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#c4c7cc" text-anchor="start">3  Gib diesen Code ein:</text>
<rect x="64" y="210" width="300" height="84" rx="12" fill="#22252a" stroke="#2EC4B6" stroke-width="2.5"/>
<text x="214" y="268" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">K7QX</text>
<text x="64" y="324" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#a7abb2" text-anchor="start">Der Code gilt noch 4:52.</text>
<rect x="64" y="346" width="130" height="38" rx="8" fill="#2f3338"/>
<text x="129" y="371" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Neuer Code</text>
